name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ARM_USE_AZUREAD: "true"
  NSP_NAME: nsp-infosys-ccd-prod-014
  NSP_PROFILE_NAME: profile-log-query
  NSP_RESOURCE_GROUP: rg-infosys-ccd-prod-014
  STATE_CONTAINER_NAME: tfstate
  STATE_STORAGE_ACCOUNT_NAME: stoinfyterrafromstate001
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.14.3"

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # - name: Get runner egress IP
      #   id: egress
      #   shell: bash
      #   run: |
      #     egress_ip="$(curl --fail --silent --show-error https://api.ipify.org)"
      #     echo "Runner egress IP: ${egress_ip}"
      #     echo "ip=${egress_ip}" >> "${GITHUB_OUTPUT}"

      # - name: Create temporary NSP access rule
      #   id: create_nsp_rule
      #   shell: bash
      #   env:
      #     NSP_RULE_NAME: github-runner-${{ github.run_id }}-${{ github.run_attempt }}
      #     RUNNER_EGRESS_IP: ${{ steps.egress.outputs.ip }}
      #   run: |
      #     az extension add --name nsp --upgrade --only-show-errors
      #     az network perimeter profile access-rule create \
      #       --resource-group "${NSP_RESOURCE_GROUP}" \
      #       --perimeter-name "${NSP_NAME}" \
      #       --profile-name "${NSP_PROFILE_NAME}" \
      #       --name "${NSP_RULE_NAME}" \
      #       --direction Inbound \
      #       --address-prefixes "[\"${RUNNER_EGRESS_IP}/32\"]" \
      #       --only-show-errors \
      #       --output none

      - name: Wait for state storage access
        shell: bash
        run: |
          for attempt in {1..30}; do
            if az storage blob list \
              --account-name "${STATE_STORAGE_ACCOUNT_NAME}" \
              --container-name "${STATE_CONTAINER_NAME}" \
              --auth-mode login \
              --num-results 1 \
              --only-show-errors \
              --output none 2>/dev/null; then
              echo "State storage is accessible."
              exit 0
            fi

            echo "Waiting for NSP rule propagation (${attempt}/30)..."
            sleep 10
          done

          echo "State storage remained inaccessible after 5 minutes." >&2
          az storage blob list \
            --account-name "${STATE_STORAGE_ACCOUNT_NAME}" \
            --container-name "${STATE_CONTAINER_NAME}" \
            --auth-mode login \
            --num-results 1 \
            --only-show-errors \
            --output none
          exit 1

      - name: Initialize Terraform
        run: >-
          terraform init
          -backend-config="environments/${{ inputs.environment }}/backend.hcl"
          -reconfigure

      - name: Validate Terraform
        run: terraform validate

      - name: Create deployment plan
        run: >-
          terraform plan
          -lock-timeout=5m
          -out=tfplan
          -var-file="environments/${{ inputs.environment }}/terraform.tfvars"

      # - name: Apply deployment plan
      #   run: terraform apply -lock-timeout=5m -auto-approve tfplan

