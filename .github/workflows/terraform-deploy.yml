name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ARM_USE_AZUREAD: "true"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.14.3"

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - terraform-container-apps
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Terraform
        run: >-
          terraform init
          -backend-config="environments/${{ inputs.environment }}/backend.hcl"
          -reconfigure

      - name: Validate Terraform
        run: terraform validate

      - name: Create deployment plan
        run: >-
          terraform plan
          -lock-timeout=5m
          -out=tfplan
          -var-file="environments/${{ inputs.environment }}/terraform.tfvars"

      - name: Apply deployment plan
        run: terraform apply -lock-timeout=5m -auto-approve tfplan
