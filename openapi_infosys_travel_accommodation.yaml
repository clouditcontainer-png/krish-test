    # -- Feedback --

    FeedbackPayload:
      type: object
      required: [feedbackId, feedbackResponse, feedbackType]
      properties:
        empNo:
          type: string
          description: Employee number (may be empty string).
        featureSpecificJson:
          type: object
          nullable: true
          description: Feature-specific metadata in JSON format.
        feedbackId:
          type: integer
          description: Feedback configuration ID.
          example: 306
        feedbackResponse:
          type: string
          description: User's selected response.
          enum: [Like, Dislike, Neutral]
        feedbackText:
          type: string
          description: Optional free-text comment.
        feedbackType:
          type: string
          description: Feedback type identifier (e.g. `LD` for Like/Dislike).
          example: LD

    FeedbackStatusRequest:
      type: object
      required: [featureName, processName, source, subFeatureName]
      properties:
        featureName:
          type: string
          example: TaxiRequest
        processName:
          type: string
          example: TaxiSubmission
        source:
          type: string
          description: Client source identifier.
          example: InfyMeWeb
        subFeatureName:
          type: string
          example: SubmitTaxiRequest

